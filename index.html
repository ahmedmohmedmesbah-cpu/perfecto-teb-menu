<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="منيو برفكتو الرقمي لعرض المنتجات والأسعار فقط.">
  <title>Perfecto Tebo | منيو برفكتو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="image" href="assets/images/storefront-hero.webp" fetchpriority="high">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css?v=mobile-categories-search-20260912">
</head>
<body data-index-page>
  <header class="site-header" data-header>
    <a class="brand" href="index.html" aria-label="بيرفكتو ماركت منيو">
      <img class="brand-logo" src="assets/images/logo.png" alt="برفكتو" width="2000" height="1414">
      <span class="brand-text">
        <small>Perfecto منيو</small>
      </span>
    </a>
    <form class="search-panel header-search" role="search" aria-label="بحث سريع">
      <label class="sr-only" for="headerSearchInput">ابحث عن منتج</label>
      <span class="icon" data-icon="search" aria-hidden="true"></span>
      <input id="headerSearchInput" data-search type="search" placeholder="ابحث باسم المنتج..." autocomplete="off">
      <button type="button" data-clear-search aria-label="مسح البحث">
        <span class="icon" data-icon="x" aria-hidden="true"></span>
      </button>
    </form>
    <nav class="category-nav" data-header-categories></nav>
  </header>

  <main>
    <section class="hero">
      <img src="assets/images/storefront-hero.webp" alt="واجهة بيرفكتو ماركت" class="hero-image" width="1600" height="1600" fetchpriority="high">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <div class="hero-logo" aria-label="برفكتو">
          <img src="assets/images/logo.png" alt="برفكتو" width="2000" height="1414">
        </div>
        <h1>أحدث المنتجات والأسعار في مكان واحد</h1>
        <p>تصفح منتجات برفكتو بسرعة واعرف الأسعار قبل ما تختار.</p>
        <form class="search-panel" role="search">
          <label class="sr-only" for="searchInput">ابحث عن منتج</label>
          <span class="icon" data-icon="search" aria-hidden="true"></span>
          <input id="searchInput" data-search type="search" placeholder="ابحث باسم المنتج..." autocomplete="off">
          <button type="button" data-clear-search aria-label="مسح البحث">
            <span class="icon" data-icon="x" aria-hidden="true"></span>
          </button>
        </form>
        <nav class="category-nav hero-category-nav" data-hero-categories aria-label="أقسام المنتجات"></nav>
      </div>
    </section>

    <section class="catalog-shell products-section" aria-labelledby="productsTitle">
      <div class="section-heading">
        <p data-results-count>جاري تحميل المنتجات...</p>
        <h2 id="productsTitle">المنتجات</h2>
      </div>
      <div class="product-grid" id="products" data-products></div>
      <div class="empty-state" data-empty hidden>
        <span class="icon" data-icon="search" aria-hidden="true"></span>
        <h3>لا توجد منتجات مطابقة</h3>
        <p>جرّب البحث بكلمة مختلفة أو اختر قسم آخر.</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <strong>برفكتو</strong>
    <span>منيو أسعار رقمي فقط، بدون طلبات أو دفع إلكتروني.</span>
  </footer>

  <script src="assets/js/app.js?v=mobile-categories-search-20260912"></script>
</body>
</html>
